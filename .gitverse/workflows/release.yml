name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Исключаем параллельные/двойные релизы для одного и того же ref
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Релиз должен запускаться только по тегу v*: github.ref_name обязан
      # быть корректным номером версии (имя файла RELEASE_NOTES, версия пакетов).
      - name: Validate tag ref
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "::error::Релиз запускается только по тегу вида v* (текущий ref: ${{ github.ref_name }}, тип: ${{ github.ref_type }}). При ручном запуске выберите тег в качестве ref."
          exit 1

      - name: Install build & packaging dependencies
        run: |
          sudo apt-get update
          # p7zip-full — 7z нужен для сборки Windows-архивов (.zip), см. build.zig
          sudo apt-get install -y p7zip-full 

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build release artifacts
        run: zig build release

      - name: Check and expose release notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"

          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Файл $NOTES_FILE не найден. Создайте его перед публикацией тега $TAG."
            exit 1
          fi

          # Тело релиза НЕ копируем через GITHUB_OUTPUT: heredoc ломается, если
          # файл не заканчивается переводом строки, содержит CRLF или
          # escape-последовательности (runner их обрабатывает). softprops/
          # action-gh-release принимает body_path — передаём путь к файлу.
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create and publish GitVerse Release
        # softprops/action-gh-release на GitVerse не работает: он обращается к
        # GitHub REST API (api.github.com) с GITHUB_TOKEN, которого на GitVerse
        # нет. GitVerse использует свой Public API (https://api.gitverse.ru) и
        # Bearer-токен. Требуется секрет CLZ_API_KEY: создайте API-ключ в
        # https://gitverse.ru/settings/tokens (права: Репозитории -> Запись) и
        # добавьте его в Secrets репозитория.
        env:
          CLZ_API_KEY: ${{ secrets.CLZ_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$CLZ_API_KEY" ]; then
            echo "::error::Секрет CLZ_API_KEY не задан. Создайте API-ключ в https://gitverse.ru/settings/tokens (права: Репозитории → Запись) и добавьте его в Secrets репозитория."
            exit 1
          fi

          API="https://api.gitverse.ru"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"
          TITLE="CheckLinks ${TAG}"
          ACCEPT="Accept: application/vnd.gitverse.object+json;version=1"
          AUTH="Authorization: Bearer ${CLZ_API_KEY}"

          # Тело релиза сериализуем в JSON через python3: это безопаснее, чем
          # вставлять содержимое файла напрямую (экранирование, CRLF, кавычки).
          python3 - "$TAG" "$TITLE" "$NOTES_FILE" > /tmp/release_body.json <<'PY'
          import json, sys
          tag, title, notes = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(notes, encoding='utf-8') as f:
              body = f.read()
          print(json.dumps({
              "tag_name": tag,
              "name": title,
              "body": body,
              "draft": True,
              "prerelease": False,
          }))
          PY

          # Создаём релиз как черновик (публикация — вручную, как и на GitHub).
          echo "Создание релиза ${TAG} в репозитории ${REPO}..."
          RESP=$(curl -sS -f \
            -X POST "${API}/repos/${REPO}/releases" \
            -H "$ACCEPT" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            --data @/tmp/release_body.json)
          RELEASE_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$RESP")
          echo "Релиз создан: id=${RELEASE_ID}"

          # Загружаем ассеты (архивы + .deb + .rpm).
          shopt -s nullglob
          ASSETS=(zig-out/compressed/*)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::Нет файлов для загрузки в релиз."
            exit 1
          fi
          for f in "${ASSETS[@]}"; do
            NAME=$(basename "$f")
            echo "Загрузка ассета: ${NAME}"
            curl -sS -f \
              -X POST "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${NAME}" \
              -H "$ACCEPT" \
              -H "$AUTH" \
              -H "Content-Type: multipart/form-data" \
              -F "attachment=@${f}" > /dev/null
          done

          echo "Готово: черновик релиза ${TAG} создан с ${#ASSETS[@]} ассетами (draft=true)."
