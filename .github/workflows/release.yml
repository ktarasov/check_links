name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install fpm
        run: |
          sudo apt-get install -y ruby ruby-dev
          sudo gem install fpm

      - name: Build release artifacts
        run: zig build release

      - name: Check and read release notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"

          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Файл $NOTES_FILE не найден. Создайте его перед публикацией тега $TAG."
            exit 1
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            cat "$NOTES_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build .deb and .rpm packages
        run: |
          VERSION="${{ github.ref_name }}"
          # Убираем ведущую 'v' для номера версии в пакетах
          PKG_VERSION="${VERSION#v}"

          # Директория для готовых пакетов
          mkdir -p packages

          # Извлекаем бинарники из Linux-архивов и собираем пакеты
          for archive in zig-out/compressed/*linux*.tar.gz; do
            # Извлекаем имя локали из имени архива
            # Пример: check_links-x86_64-linux-en.tar.gz -> en
            BASENAME=$(basename "$archive")
            LOCALE=$(echo "$BASENAME" | grep -oP '(ru|en|es|fr).tar.gz' | tr -d '.tar.gz')

            # Временная директория для распаковки
            TMPDIR=$(mktemp -d)
            tar -xzf "$archive" -C "$TMPDIR"

            # Находим бинарник
            BIN=$(find "$TMPDIR" -type f -name "check-links" | head -1)

            if [ -z "$BIN" ]; then
              echo "::error::Бинарник не найден в архиве $archive"
              exit 1
            fi

            # Создаём .deb
            fpm \
              -s dir \
              -t deb \
              -n "check_links_${LOCALE}" \
              -v "$PKG_VERSION" \
              -a x86_64 \
              --description "CLI utility for checking links on a web page (locale: ${LOCALE})" \
              --url "https://github.com/ktarasov/check_links" \
              --license MIT \
              "${BIN}=/usr/bin/check-links"

            # Создаём .rpm
            fpm \
              -s dir \
              -t rpm \
              -n "check_links_${LOCALE}" \
              -v "$PKG_VERSION" \
              -a x86_64 \
              --description "CLI utility for checking links on a web page (locale: ${LOCALE})" \
              --url "https://github.com/ktarasov/check_links" \
              --license MIT \
              "${BIN}=/usr/bin/check-links"

            rm -rf "$TMPDIR"
          done

          # Перемещаем все пакеты в одну директорию
          mv *.deb *.rpm packages/ 2>/dev/null || true

      - name: Create and publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zig-out/compressed/*
            packages/*.deb
            packages/*.rpm
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: true
          prerelease: false
          title: CheckLinks ${{ github.ref_name }}
